<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECF Commerce Général | Gestion & Marge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; }
        .excel-table th { background: #0f172a; color: white; padding: 12px; font-size: 11px; text-transform: uppercase; text-align: left; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px; font-size: 13px; color: #334155; }
        .active-entity { border-bottom: 4px solid #3b82f6; color: #3b82f6 !important; font-weight: 800; }
        .hidden { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#0f172a] text-white p-4 flex flex-wrap justify-between items-center shadow-lg gap-4">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black italic tracking-tighter">ECF<span class="text-blue-500 text-sm ml-1 uppercase"> Commerce</span></h1>
            <nav class="flex gap-4 text-[10px] font-bold text-slate-400">
                <button onclick="switchEntity('BIOMED')" id="tab-BIOMED" class="py-2 px-1 transition-all active-entity uppercase">Matériels Biomédicaux</button>
                <button onclick="switchEntity('BUREAU')" id="tab-BUREAU" class="py-2 px-1 transition-all uppercase">Fournitures & Informatique</button>
                <button onclick="switchEntity('AUTO')" id="tab-AUTO" class="py-2 px-1 transition-all uppercase">Vente Automobile</button>
            </nav>
        </div>

        <div class="flex gap-4 items-center">
            <div class="text-right">
                <p class="text-[9px] uppercase text-slate-400 font-bold">Achats</p>
                <p id="totalAchats" class="text-red-400 font-mono font-bold">0 F</p>
            </div>
            <div class="text-right border-l border-slate-700 pl-4">
                <p class="text-[9px] uppercase text-slate-400 font-bold">Ventes (Encaissé)</p>
                <p id="totalVentes" class="text-emerald-400 font-mono font-bold">0 F</p>
            </div>
            <div class="bg-slate-900 px-4 py-1 rounded border border-blue-900/50 text-right min-w-[140px]">
                <p class="text-[9px] uppercase text-blue-400 font-bold">Bénéfice Net</p>
                <p id="totalMarge" class="text-white font-mono font-black text-lg">0 FCFA</p>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b p-3 flex flex-wrap gap-2 justify-between items-center px-6">
        <div class="flex flex-wrap gap-2">
            <button onclick="openModal('entry')" class="bg-blue-600 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm"><i class="fas fa-plus mr-1"></i> Flux Manuel</button>
            
            <div id="btn-group-standard" class="flex gap-2">
                <button onclick="openModalDoc('BON')" class="bg-orange-500 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm">Bon de Commande</button>
                <button onclick="openModalDoc('FACTURE')" class="bg-slate-800 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm">Facture Normale</button>
                <button onclick="openModalDoc('REELLE')" class="bg-indigo-700 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm">Facture Réelle</button>
            </div>

            <div id="btn-group-auto" class="hidden flex gap-2">
                <button onclick="openModal('auto')" class="bg-orange-600 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm"><i class="fas fa-car mr-1"></i> Vente de Véhicule</button>
            </div>

            <button onclick="showSection('archives')" class="bg-emerald-600 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm"><i class="fas fa-archive mr-1"></i> Archives</button>
            <button onclick="showSection('compta')" class="bg-slate-500 text-white px-3 py-2 rounded text-[10px] font-bold uppercase shadow-sm">Trésorerie</button>
        </div>
        <div class="flex items-center gap-2 text-xs font-bold text-slate-500 uppercase">
            <span>Exercice</span>
            <select id="filterYear" onchange="updateDocPrefix(); fetchFirebase();" class="border p-1 rounded bg-slate-50"></select>
        </div>
    </nav>

    <main id="section-compta" class="flex-1 overflow-auto p-6">
        <div class="border rounded-lg overflow-hidden bg-white shadow-sm">
            <table class="excel-table">
                <thead>
                    <tr><th class="w-12 text-center">Réf</th><th class="w-24">Date</th><th>Opération / Véhicule</th><th>Tiers / Client</th><th class="w-40 text-center">Statut / Paiement</th><th class="text-right w-36">Encaissé (FCFA)</th><th class="w-24 text-center">Actions</th></tr>
                </thead>
                <tbody id="mainBody"></tbody>
            </table>
        </div>
    </main>

    <div id="modalAuto" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[110] backdrop-blur-sm">
        <div class="bg-white w-[550px] rounded-lg shadow-2xl p-6 border-t-4 border-orange-600">
            <h3 class="font-black mb-4 uppercase text-slate-800 border-b pb-2 text-sm text-center italic">Nouvelle Vente Véhicule Importé</h3>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="auto_client" placeholder="Nom de l'acheteur *" class="col-span-2 border p-3 rounded text-sm outline-none">
                <input type="text" id="auto_marque" placeholder="Marque du véhicule *" class="border p-3 rounded text-sm outline-none">
                <input type="text" id="auto_chassis" placeholder="N° de Châssis *" class="border p-3 rounded text-sm outline-none">
                <input type="text" id="auto_couleur" placeholder="Couleur" class="border p-3 rounded text-sm outline-none">
                <input type="text" id="auto_km" placeholder="Kilométrage" class="border p-3 rounded text-sm outline-none">
                <select id="auto_etat" class="border p-3 rounded text-sm font-bold bg-slate-50">
                    <option value="Occasion">Occasion</option>
                    <option value="Neuf">Neuf</option>
                </select>
                <select id="auto_mode" class="border p-3 rounded text-sm font-bold bg-slate-50">
                    <option value="Espèce">Espèce</option>
                    <option value="Virement">Virement</option>
                    <option value="Chèque">Chèque</option>
                </select>
                <input type="number" id="auto_prix" oninput="calcAutoSolde()" placeholder="Prix de vente *" class="border p-3 rounded text-sm font-bold">
                <input type="number" id="auto_acompte" oninput="calcAutoSolde()" placeholder="Acompte initial" class="border p-3 rounded text-sm font-bold text-emerald-600">
                <div class="col-span-2 bg-slate-100 p-2 rounded text-center">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Reste à payer</p>
                    <p id="auto_solde_txt" class="text-xl font-black text-red-600">0 F</p>
                </div>
                <button onclick="saveVenteAuto()" class="col-span-2 bg-orange-600 text-white p-4 rounded font-bold uppercase text-[11px] shadow-lg">Enregistrer la vente</button>
                <button onclick="closeModal('auto')" class="col-span-2 text-slate-400 text-[10px] font-bold uppercase text-center">Annuler</button>
            </div>
        </div>
    </div>

    <div id="modalEntry" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-[500px] rounded-lg shadow-2xl p-6 border-t-4 border-blue-600">
            <h3 class="font-black mb-4 uppercase text-slate-800 border-b pb-2 italic text-sm text-center">Nouveau Flux Trésorerie</h3>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="f_lib" placeholder="Libellé" class="col-span-2 border p-3 rounded text-sm outline-none">
                <input type="text" id="f_tiers" placeholder="Tiers" class="col-span-2 border p-3 rounded text-sm outline-none">
                <select id="f_type" class="border p-3 rounded text-sm font-bold bg-slate-50"><option value="ENTREE">RECETTE (+)</option><option value="SORTIE">DÉPENSE (-)</option></select>
                <input type="number" id="f_mt" placeholder="Montant" class="border p-3 rounded text-sm font-bold text-blue-600">
                <select id="f_mode" class="border p-3 rounded text-sm"><option>Espèce</option><option>Virement</option><option>Chèque</option></select>
                <input type="date" id="f_date" class="border p-3 rounded text-sm">
                <button onclick="saveToFirebase()" class="col-span-2 bg-blue-600 text-white p-4 rounded font-bold uppercase text-[11px]">Valider</button>
                <button onclick="closeModal('entry')" class="col-span-2 text-slate-400 text-[10px] font-bold text-center">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://ecfcommerce-b3893-default-rtdb.firebaseio.com/data.json";
        const ARCHIVE_URL = "https://ecfcommerce-b3893-default-rtdb.firebaseio.com/archives.json";
        const ADMIN_PASS = "ECF2026";

        let currentEntity = "BIOMED";
        let transactions = [];

        function cleanFormat(num) { return Math.round(num || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

        function switchEntity(e) { 
            currentEntity = e; 
            document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active-entity', b.id === 'tab-'+e)); 
            document.getElementById('btn-group-standard').classList.toggle('hidden', e === 'AUTO');
            document.getElementById('btn-group-auto').classList.toggle('hidden', e !== 'AUTO');
            fetchFirebase(); 
        }

        // LOGIQUE AUTOMOBILE
        function calcAutoSolde() {
            const p = Number(document.getElementById('auto_prix').value) || 0;
            const a = Number(document.getElementById('auto_acompte').value) || 0;
            document.getElementById('auto_solde_txt').innerText = cleanFormat(p - a) + " F";
        }

        async function saveVenteAuto() {
            const buyer = document.getElementById('auto_client').value;
            const marque = document.getElementById('auto_marque').value;
            const chassis = document.getElementById('auto_chassis').value;
            const prix = Number(document.getElementById('auto_prix').value);
            const acompte = Number(document.getElementById('auto_acompte').value) || 0;
            const mode = document.getElementById('auto_mode').value;

            if(!buyer || !marque || !chassis || !prix || !mode) return alert("Veuillez remplir les champs obligatoires (*)");

            const entry = {
                entity: 'AUTO',
                date: new Date().toISOString().split('T')[0],
                libelle: `${marque.toUpperCase()} [CHÂSSIS: ${chassis.toUpperCase()}]`,
                tiers: buyer,
                type: 'ENTREE',
                mode: mode,
                montant_total: prix,
                montant: acompte, // Montant encaissé en trésorerie
                statut: (acompte >= prix) ? 'SOLDE' : 'EN_ATTENTE'
            };

            await fetch(FIREBASE_URL, { method: 'POST', body: JSON.stringify(entry) });
            closeModal('auto'); fetchFirebase();
        }

        async function ajouterEcheance(id) {
            const versement = Number(prompt("Montant du nouveau versement pour cette échéance :"));
            if(!versement || versement <= 0) return;

            const res = await fetch(FIREBASE_URL.replace('.json', '/') + id + '.json');
            const data = await res.json();
            
            data.montant = (Number(data.montant) || 0) + versement;
            if(data.montant >= data.montant_total) data.statut = 'SOLDE';

            await fetch(FIREBASE_URL.replace('.json', '/') + id + '.json', { method: 'PUT', body: JSON.stringify(data) });
            fetchFirebase();
        }

        async function fetchFirebase() {
            const res = await fetch(FIREBASE_URL); const data = await res.json();
            transactions = data ? Object.keys(data).map(k => ({id: k, ...data[k]})) : [];
            render();
        }

        function render() {
            const body = document.getElementById('mainBody'); body.innerHTML = ''; 
            let achats = 0, ventes = 0;
            const year = document.getElementById('filterYear').value;
            
            transactions.filter(t => t.entity === currentEntity && t.date.startsWith(year)).forEach((t, i) => {
                const isE = t.type === 'ENTREE';
                const montantPaye = Number(t.montant) || 0;
                isE ? ventes += montantPaye : achats += montantPaye;

                let statusHTML = `<span class="text-[10px] bg-emerald-100 px-2 py-1 rounded text-emerald-700 font-bold uppercase">Soldé</span>`;
                let actions = `<button onclick="deleteTx('${t.id}')" class="text-slate-300">✕</button>`;

                if(t.statut === 'EN_ATTENTE') {
                    const reste = t.montant_total - t.montant;
                    statusHTML = `<span class="text-[10px] bg-orange-100 px-2 py-1 rounded text-orange-600 font-bold">RESTE: ${cleanFormat(reste)}</span>`;
                    actions = `<button onclick="ajouterEcheance('${t.id}')" class="text-emerald-600 font-bold mr-3 text-[10px] hover:underline"><i class="fas fa-plus"></i> VERSER</button>` + actions;
                }

                body.innerHTML += `<tr>
                    <td class="text-center opacity-30">${i+1}</td>
                    <td>${t.date}</td>
                    <td class="font-bold uppercase">${t.libelle}</td>
                    <td>${t.tiers || '-'}</td>
                    <td class="text-center">${statusHTML}</td>
                    <td class="text-right font-black ${isE?'text-emerald-600':'text-red-500'}">${cleanFormat(montantPaye)}</td>
                    <td class="text-center">${actions}</td>
                </tr>`;
            });

            const marge = ventes - achats;
            document.getElementById('totalAchats').innerText = cleanFormat(achats) + " F";
            document.getElementById('totalVentes').innerText = cleanFormat(ventes) + " F";
            document.getElementById('totalMarge').innerText = cleanFormat(marge) + " FCFA";
        }

        async function deleteTx(id) { if(prompt("PASS ADMIN?") === ADMIN_PASS) { await fetch(FIREBASE_URL.replace('.json', '/') + id + '.json', { method: 'DELETE' }); fetchFirebase(); } }
        function openModal(id) { document.getElementById('modal' + id.charAt(0).toUpperCase() + id.slice(1)).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById('modal' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('hidden'); }
        async function saveToFirebase() {
            if(prompt("PASS ADMIN?") !== ADMIN_PASS) return;
            const entry = { entity: currentEntity, date: document.getElementById('f_date').value, libelle: document.getElementById('f_lib').value, tiers: document.getElementById('f_tiers').value, type: document.getElementById('f_type').value, mode: 'Espèce', montant: Number(document.getElementById('f_mt').value) || 0 };
            await fetch(FIREBASE_URL, { method: 'POST', body: JSON.stringify(entry) });
            closeModal('entry'); fetchFirebase();
        }

        function setupYears() {
            const s = document.getElementById('filterYear');
            for(let y=2024; y<=2030; y++){
                let o = document.createElement('option'); o.value=y; o.text="EXERCICE "+y;
                if(y==new Date().getFullYear()) o.selected=true; s.add(o);
            }
        }
        
        setupYears();
        switchEntity('BIOMED');
    </script>
</body>
</html>
