<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ECF GROUPE - GESTION COMMERCIALE & BIOMED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="loginScreen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-lg shadow-2xl p-8">
            <h2 class="text-3xl font-black italic text-slate-900 text-center mb-8 uppercase border-b-4 border-blue-600 pb-2">ECF GROUPE</h2>
            <div class="space-y-4">
                <input type="text" id="agentID" placeholder="ID AGENT" class="w-full border-2 p-3 rounded font-bold uppercase outline-none focus:border-blue-600">
                <input type="password" id="agentPass" placeholder="MOT DE PASSE" class="w-full border-2 p-3 rounded font-bold outline-none focus:border-blue-600">
                <button onclick="verifierConnexion()" class="w-full bg-blue-700 text-white p-4 rounded font-black uppercase tracking-widest hover:bg-black transition-all">ACCÉDER</button>
            </div>
        </div>
    </div>

    <div id="appContent" class="hidden">
        <header id="mainHeader" class="text-white shadow-xl transition-colors duration-500">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black italic uppercase leading-none">ECF GROUPE</h1>
                    <p id="labelStructure" class="text-[10px] font-bold tracking-[0.2em] uppercase mt-1 opacity-80"></p>
                </div>
                <button onclick="deconnexion()" class="bg-black/30 hover:bg-black px-4 py-2 rounded text-[10px] font-black uppercase transition-all">Quitter</button>
            </div>
            <div class="bg-black/20 flex border-t border-white/10">
                <button onclick="changerSecteur('BIOMED')" id="tab-BIOMED" class="flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4">Biomédicaux</button>
                <button onclick="changerSecteur('GENERAL')" id="tab-GENERAL" class="flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4">Commerce Général</button>
            </div>
        </header>

        <nav class="bg-white border-b sticky top-0 z-40 p-4 shadow-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex gap-2">
                    <button onclick="openModal('modalCommande')" class="bg-blue-900 text-white px-4 py-2 rounded font-black text-[11px] uppercase italic">+ Nouveau Bon de Commande</button>
                </div>
                <div id="navTabs" class="flex gap-6 text-[10px] font-black uppercase text-slate-400">
                    <button onclick="switchView('mouv')" id="nav-mouv" class="pb-1 border-b-4 border-blue-600 text-slate-900">Mouvements</button>
                    <button onclick="switchView('archives')" id="nav-archives" class="pb-1">Archives Documents</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6">
            <div id="view-mouv" class="bg-white rounded shadow-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-900 text-white text-[10px] uppercase">
                        <tr><th class="p-4">Date</th><th class="p-4">Client</th><th class="p-4">Référence</th><th class="p-4 text-right">Total Vente</th><th class="p-4 text-center">Actions</th></tr>
                    </thead>
                    <tbody id="tableMouv" class="divide-y text-sm font-bold"></tbody>
                </table>
            </div>

            <div id="view-archives" class="hidden bg-white rounded shadow-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-blue-900 text-white text-[10px] uppercase">
                        <tr><th class="p-4">Date</th><th class="p-4">Document</th><th class="p-4">Client</th><th class="p-4 text-center">Action</th></tr>
                    </thead>
                    <tbody id="tableArchives" class="divide-y text-sm font-bold"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalCommande" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-5xl rounded p-8 overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-black uppercase italic mb-6 border-b-2 border-blue-600">Saisie Bon de Commande</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <input type="text" id="c_client" placeholder="NOM DU CLIENT *" class="in-box">
                <input type="text" id="c_ref" placeholder="RÉFÉRENCE COMMANDE" class="in-box">
                <input type="date" id="c_date" class="in-box">
            </div>

            <div class="bg-slate-50 p-4 rounded mb-6">
                <h3 class="text-xs font-black uppercase mb-3 text-slate-500">Ajouter des produits</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                    <input type="text" id="p_nom" placeholder="Désignation" class="in-box">
                    <input type="number" id="p_qte" placeholder="Quantité" class="in-box">
                    <input type="number" id="p_achat" placeholder="P.U Achat" class="in-box">
                    <input type="number" id="p_vente" placeholder="P.U Vente" class="in-box">
                </div>
                <button onclick="ajouterProduit()" class="mt-3 w-full bg-slate-900 text-white p-2 rounded font-bold text-xs">+ AJOUTER À LA LISTE</button>
            </div>

            <table class="w-full mb-6 text-xs font-bold">
                <thead class="bg-slate-200">
                    <tr><th class="p-2 text-left">Produit</th><th class="p-2 text-center">Qte</th><th class="p-2 text-right">Achat</th><th class="p-2 text-right">Vente</th><th class="p-2 text-center">X</th></tr>
                </thead>
                <tbody id="listeProduits" class="divide-y"></tbody>
            </table>

            <div class="flex gap-4">
                <button onclick="closeModals()" class="flex-1 bg-slate-100 p-4 rounded font-bold uppercase">Annuler</button>
                <button onclick="validerCommande()" class="flex-1 bg-blue-700 text-white p-4 rounded font-black uppercase italic">Valider & Générer les 3 PDF</button>
            </div>
        </div>
    </div>

    <style> .in-box { @apply border-2 p-3 rounded font-bold outline-none w-full text-sm bg-white focus:border-blue-600; } </style>

    <script>
        const API_BASE = "https://ecflogistique-68af7-default-rtdb.firebaseio.com/ecf_final";
        const AGENTS = { "PDTCISSE": "Cisseadama", "ADMIN": "Admin2026" };
        let currentAgent = "", curSecteur = "BIOMED";
        let tempProduits = [];
        let db = { mouv: {}, archives: {} };

        async function verifierConnexion() {
            const id = document.getElementById('agentID').value.toUpperCase();
            if(AGENTS[id] === document.getElementById('agentPass').value) {
                currentAgent = id;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                await changerSecteur('BIOMED');
            } else { alert("Identifiants incorrects"); }
        }

        function deconnexion() { location.reload(); }

        async function changerSecteur(secteur) {
            curSecteur = secteur;
            const header = document.getElementById('mainHeader');
            const tabB = document.getElementById('tab-BIOMED');
            const tabG = document.getElementById('tab-GENERAL');
            
            if(secteur === 'BIOMED') {
                header.className = "bg-blue-900 text-white shadow-xl transition-colors duration-500";
                document.getElementById('labelStructure').innerText = 'Secteur Biomédicaux';
                tabB.className = "flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4 border-white bg-white/10";
                tabG.className = "flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4 border-transparent opacity-50";
            } else {
                header.className = "bg-emerald-800 text-white shadow-xl transition-colors duration-500";
                document.getElementById('labelStructure').innerText = 'Commerce Général';
                tabG.className = "flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4 border-white bg-white/10";
                tabB.className = "flex-1 py-3 font-black text-xs uppercase tracking-widest border-b-4 border-transparent opacity-50";
            }
            await refresh();
        }

        async function refresh() {
            const res = await fetch(`${API_BASE}/${curSecteur}.json`);
            const d = await res.json() || {};
            db = { mouv: d.mouv||{}, archives: d.archives||{} };
            render();
        }

        function render() {
            const tMouv = document.getElementById('tableMouv');
            const tArch = document.getElementById('tableArchives');
            tMouv.innerHTML = ''; tArch.innerHTML = '';

            Object.keys(db.mouv).sort((a,b)=>db.mouv[b].ts - db.mouv[a].ts).forEach(k => {
                const m = db.mouv[k];
                tMouv.innerHTML += `<tr><td class="p-4">${m.date}</td><td class="p-4 uppercase">${m.client}</td><td class="p-4">${m.ref}</td><td class="p-4 text-right text-emerald-600">${fmt(m.totalVente)}</td><td class="p-4 text-center"><button onclick="suppr('${k}')" class="text-red-500">Supprimer</button></td></tr>`;
            });

            Object.keys(db.archives).sort((a,b)=>b.localeCompare(a)).forEach(k => {
                const a = db.archives[k];
                tArch.innerHTML += `<tr><td class="p-4">${a.date}</td><td class="p-4 font-black text-blue-700">${a.type}</td><td class="p-4 uppercase">${a.client}</td><td class="p-4 text-center"><button onclick="reprint('${k}')" class="bg-slate-800 text-white px-3 py-1 rounded text-[9px] uppercase font-black">Rééditer PDF</button></td></tr>`;
            });
        }

        function ajouterProduit() {
            const nom = document.getElementById('p_nom').value;
            const qte = Number(document.getElementById('p_qte').value);
            const ach = Number(document.getElementById('p_achat').value);
            const ven = Number(document.getElementById('p_vente').value);
            if(!nom || qte <= 0) return;
            tempProduits.push({ nom, qte, prixAchat: ach, prixVente: ven });
            document.getElementById('p_nom').value = ""; document.getElementById('p_qte').value = ""; document.getElementById('p_achat').value = ""; document.getElementById('p_vente').value = "";
            renderTempTable();
        }

        function renderTempTable() {
            const b = document.getElementById('listeProduits'); b.innerHTML = '';
            tempProduits.forEach((p, i) => {
                b.innerHTML += `<tr><td class="p-2">${p.nom}</td><td class="p-2 text-center">${p.qte}</td><td class="p-2 text-right">${fmt(p.prixAchat)}</td><td class="p-2 text-right">${fmt(p.prixVente)}</td><td class="p-2 text-center text-red-500 cursor-pointer" onclick="tempProduits.splice(${i},1);renderTempTable();">X</td></tr>`;
            });
        }

        async function validerCommande() {
            const client = document.getElementById('c_client').value;
            if(!client || tempProduits.length === 0) return alert("Infos manquantes");
            
            const totalAchat = tempProduits.reduce((s,p)=>s+(p.qte*p.prixAchat), 0);
            const totalVente = tempProduits.reduce((s,p)=>s+(p.qte*p.prixVente), 0);
            const data = { 
                client, 
                ref: document.getElementById('c_ref').value || 'SANS REF', 
                date: document.getElementById('c_date').value || new Date().toLocaleDateString('fr-FR'),
                produits: tempProduits,
                totalAchat,
                totalVente,
                ts: Date.now()
            };

            await fetch(`${API_BASE}/${curSecteur}/mouv.json`, { method:'POST', body:JSON.stringify(data) });
            await fetch(`${API_BASE}/${curSecteur}/archives.json`, { method:'POST', body:JSON.stringify({ date: data.date, type: 'PACK_COMMANDE', data: data, client: data.client }) });
            
            // Génération des 3 documents
            genereDocument(data, "LIVRAISON");
            genereDocument(data, "PROFORMA_VENTE");
            genereDocument(data, "PROFORMA_ACHAT");

            tempProduits = []; closeModals(); refresh();
        }

        // --- LOGIQUE PDF AVEC ESPACES POUR PAPIER EN-TÊTE ---
        function genereDocument(cmd, type) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            let titre = "";
            let colonnes = [];
            let corps = [];

            if (type === "LIVRAISON") {
                titre = "BON DE LIVRAISON";
                colonnes = [["DÉSIGNATION", "QUANTITÉ"]];
                corps = cmd.produits.map(p => [p.nom.toUpperCase(), p.qte]);
            } else if (type === "PROFORMA_VENTE") {
                titre = "FACTURE PROFORMA (PRIX DE VENTE)";
                colonnes = [["DÉSIGNATION", "QTE", "P.U", "TOTAL"]];
                corps = cmd.produits.map(p => [p.nom.toUpperCase(), p.qte, fmt(p.prixVente), fmt(p.qte * p.prixVente)]);
            } else if (type === "PROFORMA_ACHAT") {
                titre = "FACTURE PROFORMA (PRIX D'ACHAT)";
                colonnes = [["DÉSIGNATION", "QTE", "P.U", "TOTAL"]];
                corps = cmd.produits.map(p => [p.nom.toUpperCase(), p.qte, fmt(p.prixAchat), fmt(p.qte * p.prixAchat)]);
            }

            // MARGE HAUTE : Le tableau commence à 80mm (startY) pour laisser l'en-tête
            doc.setFontSize(14);
            doc.text(titre, 105, 70, { align: 'center' }); // Juste avant le tableau

            doc.setFontSize(10);
            doc.text(`Client: ${cmd.client.toUpperCase()}`, 15, 75);
            doc.text(`Date: ${cmd.date}`, 150, 75);

            doc.autoTable({
                startY: 82, // Espace conséquent en haut
                head: colonnes,
                body: corps,
                theme: 'grid',
                headStyles: { fillColor: [40, 40, 40] },
                margin: { bottom: 60 } // Espace conséquent en bas
            });

            const finalY = doc.lastAutoTable.finalY + 10;
            if (type !== "LIVRAISON") {
                const total = type === "PROFORMA_VENTE" ? cmd.totalVente : cmd.totalAchat;
                doc.setFontSize(12);
                doc.text(`TOTAL GÉNÉRAL: ${fmt(total)}`, 195, finalY, { align: 'right' });
            }

            // Signature décalée vers le bas
            doc.setFontSize(10);
            doc.text("Le Responsable,", 150, finalY + 20);
            doc.text("Cachet et Signature", 150, finalY + 40);

            doc.save(`${type}_${cmd.client}.pdf`);
        }

        function fmt(n) { return (n||0).toLocaleString('fr-FR') + " F"; }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModals() { document.getElementById('modalCommande').classList.add('hidden'); }
        function switchView(v) {
            document.getElementById('view-mouv').classList.toggle('hidden', v !== 'mouv');
            document.getElementById('view-archives').classList.toggle('hidden', v !== 'archives');
            document.getElementById('nav-mouv').className = v === 'mouv' ? "pb-1 border-b-4 border-blue-600 text-slate-900" : "pb-1";
            document.getElementById('nav-archives').className = v === 'archives' ? "pb-1 border-b-4 border-blue-600 text-slate-900" : "pb-1";
        }
        function reprint(k) {
            const a = db.archives[k];
            genereDocument(a.data, "LIVRAISON");
            genereDocument(a.data, "PROFORMA_VENTE");
            genereDocument(a.data, "PROFORMA_ACHAT");
        }
        async function suppr(k) { if(confirm("Supprimer cette commande ?")) { await fetch(`${API_BASE}/${curSecteur}/mouv/${k}.json`, { method:'DELETE' }); refresh(); }}
    </script>
</body>
</html>
